<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Descubra seu Signo</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <div class="container">
        <h1>✨ Descubra seu Signo ✨</h1>
        <p>Informe seus dados abaixo para salvar seu cadastro e conferir seu signo zodíacal.</p>

        <form id="formSigno">
            <div class="form-group">
                <label for="nome">Nome Completo:</label>
                <input type="text" id="nome" name="nome" placeholder="Digite seu nome" required>
            </div>

            <div class="form-group">
                <label for="email">E-mail:</label>
                <input type="email" id="email" name="email" placeholder="seuemail@exemplo.com" required>
            </div>

            <div class="form-group">
                <label for="data_nascimento">Data de Nascimento:</label>
                <input type="date" id="data_nascimento" name="data_nascimento" required>
            </div>

            <button type="submit" id="btnDescobrir">Descobrir Signo</button>
        </form>

        <div id="mensagemErro" class="erro escondido"></div>

        <div id="resultadoContainer" class="resultado escondido">
            <h2>Resultado Astrológico</h2>
            <p>Olá, <strong id="resNome"></strong>!</p>
            <p>Seu signo é: <span id="resSigno" class="destaque"></span></p>

            <div class="detalhes">
                <p>🔥 <strong>Elemento:</strong> <span id="resElemento"></span></p>
                <p>🪐 <strong>Planeta Regente:</strong> <span id="resPlaneta"></span></p>

                <div class="secao-caracteristicas">
                    <p>⭐ <strong>Principais Características:</strong></p>
                    <ul id="listaCaracteristicas"></ul>
                </div>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>

</html>
